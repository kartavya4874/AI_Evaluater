server {
    listen 80;
    listen [::]:80;
    server_name your_domain.com; # <<< CRITICAL: UPDATE THIS TO YOUR LIVE DOMAIN OR IP ADDRESS

    # 1. SERVE STATIC FRONTEND ASSETS (Default root)
    root /home/gthdgx/project/ai-examer/AI_Evaluater/frontend/build;
    index index.html;

    # All requests that don't match a specific block are served from the built SPA files
    location / { 
        try_files $uri $uri/ /index.html; 
    }

    # 2. BACKEND API GATEWAY (Flask/Gunicorn)
    # Only traffic hitting /api/ will be routed to our dedicated backend socket.
    # This absolutely does not touch other routes, like jupyterhub or vllm's root endpoint.
    location /api/ {
        proxy_pass http://unix:/tmp/ai_examiner.sock; 
        proxy_set_header Host $host;
        proxy_set_header X-Real-Client-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr; 
        # Forward common headers for the backend context
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep time limits generous but contained to prevent infinite blocks
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Example: If vLLM ran on a specific path, we would add it here for clarity.
    # location /vllm/openai {
    #     proxy_pass http://localhost:8000; # Assuming VLLM runs locally on 8000
    # }

}
}